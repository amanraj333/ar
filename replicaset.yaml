apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: aman-replica
  labels:
    app: web

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
      - name: aman-cont
        image: nginx
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: aman-service

spec:
  selector:
    app: nginx

  ports:
    - protocol: TCP
      port: 88
      targetPort: 80

  type: ClusterIP